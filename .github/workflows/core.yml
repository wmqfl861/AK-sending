name: Core and authenticated direct checks
on:
  push:
    branches: ["dev/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch only committed locked dependencies
        run: cargo fetch --locked
      - name: Run required checks with real command evidence
        run: python scripts/run_validation.py --output validation/${{ matrix.os }} --timeout 600
      - name: Record resolved feature graph
        run: cargo tree --workspace --locked --offline --edges features
      - name: Ensure validation did not change tracked sources
        run: git diff --exit-code -- Cargo.toml Cargo.lock crates scripts config .github
      - name: Preserve all attempt logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation/
          if-no-files-found: warn
          retention-days: 14
