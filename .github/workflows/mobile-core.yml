name: Mobile core compile probes (not device acceptance)
on:
  push:
    branches: ["dev/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mobile-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: aarch64-linux-android
          - os: macos-14
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust and target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add ${{ matrix.target }} --toolchain 1.97.1
          rustc --version --verbose
      - name: Configure installed Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"
          cat "$NDK/source.properties"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android26-clang"
          "$BIN/aarch64-linux-android26-clang" --version
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
      - name: Record Apple SDK
        if: matrix.target == 'aarch64-apple-ios'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Locked dependency prefetch
        run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Compile core library for mobile target
        run: cargo check --package ak-transport --lib --target ${{ matrix.target }} --locked --offline
      - name: Ensure source and lock are unchanged
        run: git diff --exit-code -- Cargo.lock Cargo.toml crates scripts config .github
