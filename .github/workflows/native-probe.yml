name: M0 native link and FFI probes (not device acceptance)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-probe-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/native
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - name: Pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Fixed Apple toolchain
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode_26.6.app
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
      - name: Locked public dependency prefetch
        run: cargo fetch --manifest-path experiments/platform_probe/native/Cargo.toml --locked
      - name: Enable isolated network-stack test on Linux only
        if: runner.os == 'Linux'
        run: echo 'AK_TEST_NETNS=1' >> "$GITHUB_ENV"
      - name: Actual native tests, release link and dynamic ABI load
        run: python scripts/run_native_validation.py --output validation/native
      - name: Archive exact committed source
        if: always()
        run: |
          mkdir -p validation/native
          git archive --format=zip --output=validation/native/source.zip HEAD
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: validation/native/
          retention-days: 14
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: aarch64-linux-android
          - os: macos-26
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - name: Pinned Rust and target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add ${{ matrix.target }} --toolchain 1.97.1
      - name: Fixed Android NDK and API26 linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          mkdir -p validation/toolchain
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version | tee validation/toolchain/sdkmanager.txt
          "$SDKMANAGER" 'ndk;29.0.14206865' 2>&1 | tee validation/toolchain/ndk-install.txt
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          cat "$NDK/source.properties" | tee validation/toolchain/ndk.txt
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android26-clang"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-Clink-arg=-Wl,-z,max-page-size=16384' >> "$GITHUB_ENV"
          echo "AK_READELF=$BIN/llvm-readelf" >> "$GITHUB_ENV"
      - name: Fixed Xcode and iOS SDK
        if: matrix.target == 'aarch64-apple-ios'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.5'
          mkdir -p validation/toolchain
          xcodebuild -version | tee validation/toolchain/xcode.txt
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          echo 'IPHONEOS_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Locked public dependency prefetch including host
        run: cargo fetch --manifest-path experiments/platform_probe/native/Cargo.toml --locked
      - name: Actual target release link, not cargo check
        run: python scripts/run_native_validation.py --target ${{ matrix.target }} --output validation/native
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}-${{ github.event.pull_request.head.sha }}
          path: validation/
          retention-days: 14
