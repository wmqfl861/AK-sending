[workspace]
members = [
    "crates/ak-core",
    "crates/ak-identity",
    "crates/ak-wire",
    "crates/ak-storage",
    "crates/ak-net",
    "crates/ak-discovery",
    "crates/ak-store",
    "crates/ak-signal",
    "crates/ak-engine",
    "crates/ak-session",
    "crates/ak-cli",
    "crates/ak-itests",
    "crates/ak-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
ak-core = { path = "crates/ak-core" }
ak-identity = { path = "crates/ak-identity" }
ak-wire = { path = "crates/ak-wire" }
ak-storage = { path = "crates/ak-storage" }
ak-net = { path = "crates/ak-net" }
ak-discovery = { path = "crates/ak-discovery" }
ak-store = { path = "crates/ak-store" }
ak-signal = { path = "crates/ak-signal" }
ak-engine = { path = "crates/ak-engine" }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
env_logger = "0.11"
if-addrs = "0.13"
log = "0.4"
mdns-sd = "0.11"
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
# ADR-002 controlled addition: bundled C SQLite for the optional ak-store
# `sqlite` checkpoint backend (BACKLOG P1-03); MSVC-compilable, no relay path.
# 0.41 required by RUSTSEC-2026-0459 (libsqlite3-sys >= 0.39, SQLite 3.54.0).
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
socket2 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }

[profile.release]
debug = false
