[package]
name = "ak-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Command-line prototype: LAN transfer, pairing, coordination server, direct-connect probe"

[dependencies]
ak-core = { workspace = true }
ak-discovery = { workspace = true }
ak-engine = { workspace = true }
ak-identity = { workspace = true }
ak-net = { workspace = true }
# Wave 21 (B7): `server-persistence` is required by `ak-cli registry-server`
# (the authoritative v2 registry: TLS + SQLite invite store). No plaintext
# downgrade exists; the feature only links the server-side engine/store.
ak-signal = { workspace = true, features = ["server-persistence"] }
# Wave 21 (B7): the pairing orchestration (RegistryClient +
# PairingOrchestrator) and the scheduler runtime behind
# `daemon --same-code/--cross-code` (SessionHandle::set_policy). Path dep:
# ak-session is not (yet) a workspace.dependencies entry.
ak-session = { path = "../ak-session" }
# Wave 27 (P1-02): `send` reads the Ready pairing relations of the pairing
# journal (`.akpair` records) to build the scheduler admission context.
ak-store = { workspace = true }
ak-storage = { workspace = true }
ak-wire = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
# ADR-002 controlled addition (clap family, generator only, no I/O side
# effects): shell completion scripts for `ak-cli completions`.
clap_complete = "4"
env_logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "ak-cli"
path = "src/main.rs"

[features]
# G5 / E1 (docs/REVIEW_2026-11-12-acceptance.zh-CN.md §6, frozen model):
# opt-in build of the legacy plaintext signal UX. `signal-server` (the old
# TCP 7100 coordination server) and `probe` (its Hello-authenticated
# client, which registers candidates with that server) exist only when
# this feature is on; default builds compile neither. NOT gated:
# `stun-server` (CR-P2-13 standalone STUN responder, nat-matrix depends
# on it) and `registry-server` (the v2 registry; server-persistence).
legacy-plaintext-signal = ["ak-signal/legacy-plaintext-signal"]
# CR-P3-16 (review 2026-11-13-batchH §4): opt-in compile gate for the
# hidden AK_EXP_* test knobs — ak-cli's own `AK_EXP_SEND_DELAY_MS` /
# `AK_EXP_SEND_RETRY_MS` (task_cli.rs, the NAT matrix's late-send and
# decline-retry cases) plus the knobs living in this crate's task-plane
# dependencies (ak-session's `AK_EXP_NO_TTL`, ak-net's
# `AK_EXP_QUIC_WINDOW_KIB`), forwarded so ONE flag arms every knob the
# matrix drives. Off (the default) each read is not compiled at all:
# behavior is bit-identical to the env-unset branch and the variable
# NAMES are absent from release binaries (strings stay clean). Test
# infrastructure ONLY — release builds MUST NOT enable it (the NAT
# matrix job passes --features exp-knobs explicitly).
exp-knobs = ["ak-session/exp-knobs", "ak-net/exp-knobs"]

[dev-dependencies]
tempfile = "3"
