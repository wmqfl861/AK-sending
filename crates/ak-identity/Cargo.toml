[package]
name = "ak-identity"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Device identity: Ed25519 keys, fingerprints, pairing codes, pinned-certificate verification"

[dependencies]
ak-core = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
# Already in the workspace graph via rcgen/rustls; needed for the
# PrivatePkcs8KeyDer argument of rcgen::KeyPair::from_pkcs8_der_and_sign_algo.
rustls-pki-types = "1"
thiserror = { workspace = true }
