[package]
name = "ak-net"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "QUIC direct channel: the only producer of authenticated direct connections"

[dependencies]
ak-core = { workspace = true }
ak-identity = { workspace = true }
ak-wire = { workspace = true }
if-addrs = { workspace = true }
log = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[features]
# CR-P3-16 (review 2026-11-13-batchH §4): opt-in compile gate for the
# hidden AK_EXP_* test knobs this crate carries (`AK_EXP_QUIC_WINDOW_KIB`
# in `src/tls.rs` — the netem benchmark's default-window A/B arm). Off
# (the default) the knob's environment read is not compiled at all: the
# behavior is bit-identical to the env-unset branch and the variable
# NAME is absent from release binaries (strings stay clean — ak-net
# links into libak_ffi, so this is the Android/Windows release surface).
# Test infrastructure ONLY — release builds MUST NOT enable it (the
# netem runner builds with --features ak-net/exp-knobs explicitly).
exp-knobs = []

# CR-P1-06 (review 2026-11-11 §4.5 改法 1): the per-packet TTL sendmsg
# control messages need the platform cmsg constants (IP_TTL /
# IPV6_HOPLIMIT) and cmsghdr layout on the Unix-likes; Windows ships the
# documented degradation instead (see `holepunch::per_packet_ttl_supported`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = { workspace = true }
tokio = { version = "1", features = ["test-util"] }
