[package]
name = "ak-session"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Shared session application layer: pure scheduler domain model (two-dimensional concurrency, queue, admission); no networking or I/O"

[dependencies]
ak-core = { workspace = true }
# Wave 24: the real transfer executor adapter (`runtime/real_executor.rs`)
# drives the engine's receive entry behind the `TransferExecutor` trait,
# and classifies `EngineError::Connect` onto the stable error codes (the
# net error taxonomy lives here). No cycle: neither crate depends on
# ak-session.
ak-engine = { workspace = true }
ak-net = { workspace = true }
# Wave 21 (A6): device keys, invite codes, pairing transcripts, peer book.
ak-identity = { workspace = true }
# Wave 21 (A6): v2 control-protocol codec, frozen signature domains and the
# pinned-TLS dialer of the authoritative registry (public server-side
# surface). The server engine/store stay behind ak-signal's
# `server-persistence` feature and are only linked in tests.
ak-signal = { workspace = true }
# Wave 21 (A6): the local pairing-transaction journal (`pairing_journal`).
ak-store = { workspace = true }
# CR-P2-11 (review 2026-11-11): `pairing::task_net` — the v1 task-plane
# connectivity plumbing shared verbatim by ak-ffi and ak-cli — delivers the
# idle TASK-CLOSE notification as one `ak_wire` Error frame, so the shared
# module needs the frozen frame codec (ak-wire depends on nothing above
# ak-core; no cycle).
ak-wire = { workspace = true }
blake3 = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The e2e pairing tests boot the real v2 registry server (engine + SQLite
# store), which lives behind this feature. Dev-only: the ak-session library
# itself never links a server-side SQLite.
ak-signal = { workspace = true, features = ["server-persistence"] }
env_logger = { workspace = true }
# CR-P1-06/CR-P3-09: the task_net dial-pass/pause tests run on the paused
# clock so their time bounds are exact (dev-only; same workspace tokio).
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
