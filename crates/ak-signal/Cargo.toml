[package]
name = "ak-signal"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Coordination plane: signaling server/client and minimal STUN; carries no file bytes"

[dependencies]
ak-identity = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
# A3 (client_v2): CSPRNG request ids / nonces (pairing-flow.md: ids come from
# the OS CSPRNG, never from util::unique_bytes).
rand = { workspace = true }
# A3 (client_v2): TLS control connections with registry fingerprint pinning
# (pairing-flow.md §3). Reuses the rustls already locked in the workspace
# graph via ak-net (rustls 0.23, ring provider); tokio-rustls is the thin
# async adapter for it over tokio TcpStream. Declared locally (not in the
# shared workspace table) to avoid cross-agent edits of the root Cargo.toml.
rustls = { workspace = true }
# default-features off: the workspace locks the ring provider (ak-net
# discipline); tokio-rustls's default would add the aws-lc-rs provider.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tempfile = "3"

# A2 (server_v2): the authoritative invite registry backend. Optional so
# the default dependency graph never links a server-side SQLite — the v2
# registry server refuses invite operations without it (storage-schema.md
# part 1). rusqlite stays at the workspace-locked bundled version.
[features]
server-persistence = ["dep:rusqlite"]
# G5 / E1 (docs/REVIEW_2026-11-12-acceptance.zh-CN.md §6, frozen model):
# the old PLAINTEXT v1 signal plane — `client` (SignalClient over raw TCP),
# `server` (TCP signaling + bundled STUN responder) and the v1 wire `codec`
# they share — leaves the default build. Default artifacts (workspace
# default, ak-ffi/GUI chain, CI) compile none of it; the modules return only
# when this feature is explicitly enabled (frozen legacy, no new features).
# NOT behind this gate: `stun` (CR-P2-13 standalone service, v1 tasks and
# nat-matrix depend on it), `protocol_v2`/`client_v2`/`server_v2` (the v2
# registry plane), and every `util` helper except `read_frame` (the v1
# TCP framing reader, gated with the codec constants it enforces). The v2
# plane has its own independent codec (protocol_v2) and framing
# (server_v2::framing); nothing in the default graph references the gated
# modules (verified: the only cross reference is the prose comparison in
# protocol_v2's module docs).
legacy-plaintext-signal = []

[dependencies.rusqlite]
workspace = true
optional = true
