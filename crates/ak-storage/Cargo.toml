[package]
name = "ak-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Local source scanning and save targets with path-safety and atomic commits"

[dependencies]
ak-core = { workspace = true }
blake3 = { workspace = true }
# Maintenance-only deps (ADR-002 controlled additions): fs2 -> real free-space
# query (GetDiskFreeSpaceExW / statvfs); filetime -> set the sender's mtime on
# committed files. Both are small, widely used, and unsafe-free for our paths.
filetime = "0.2"
fs2 = "0.4"
thiserror = { workspace = true }

# M-N1 mitigation (batch N, 2026-11-17), Unix-only: safe (no `unsafe`)
# getrlimit/setrlimit wrappers behind `raise_nofile_soft_limit_to_hard`,
# which the CLI and FFI call at startup. Already present in Cargo.lock
# transitively; default features off. `fs` (batch S review, S-N3) adds the
# safe `renameat2(RENAME_NOREPLACE)` wrapper the Linux/Android commit uses,
# and `std` its `&Path` arguments and `io::Error` conversion. tempfile
# already enables both, but only test builds see tempfile, so they are
# named here; no new crate either way.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "fs", "std"] }

# M-N1 part-file identity on Windows (review 2026-11-18): the safe
# `GetFileInformationByHandle` wrapper (volume serial + file index), so
# this crate stays `forbid(unsafe_code)`. Already present in Cargo.lock
# transitively (same-file, walkdir).
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
tempfile = "3"
