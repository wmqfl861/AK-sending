name: ak_ffi_dart
description: Pure-Dart bindings and state layer over the AK-sending ak-ffi C ABI (ADR-003); consumable by the future Flutter app via path dependency.
version: 0.1.0
publish_to: none

environment:
  # ^3.1.0 (was ^3.0.0): dart:ffi's NativeCallable — the CR-P2-05
  # (2026-11-12) native event doorbell registers its listener through
  # it — is @Since('3.1') in the SDK. The Flutter app already requires
  # Dart ^3.13.7, so this raises no consumer's floor.
  sdk: ^3.1.0

dependencies:
  # C03 (codex-crash-analysis-2026-11-07): the ONE matched C heap pair used
  # for every native buffer this package allocates/frees. package:ffi's
  # malloc/free come from a single implementation (Windows:
  # CoTaskMemAlloc/CoTaskMemFree out of ole32.dll; POSIX: the libc
  # malloc/free pair), so a cross-CRT free can no longer occur even when
  # several modules in the process each export malloc/free.
  ffi: ^2.0.0

dev_dependencies:
  test: ^1.24.0
